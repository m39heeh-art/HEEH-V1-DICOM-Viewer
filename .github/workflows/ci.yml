name: CI

on:
  push:
    branches: ["main", "master", "publication-v1.0.2"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest ruff
      - name: Dependency consistency
        run: |
          python -m pip check
          python -m compileall -q app.py core engines utils
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deployment image
        run: docker compose build
      - name: Start and verify deployment image
        run: |
          docker compose up --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              exit 0
            fi
            if [ "$(docker compose ps --status running --quiet)" = "" ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done
          docker compose logs --no-color
          exit 1
      - name: Stop deployment image
        if: always()
        run: docker compose down --remove-orphans