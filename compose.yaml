services:
  app:
    platform: linux/amd64
    build:
      context: .
    image: heeh-v1-dicom-viewer:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=4g,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
