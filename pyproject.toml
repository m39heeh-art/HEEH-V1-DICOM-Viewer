[project]
name = "heeh-v1-dicom-viewer"
version = "1.0.2"
description = "HEEH-V1(TM) DICOM Viewer: a research and education web application for medical image analysis, tissue classification, and scientific metrics."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
keywords = ["medical-imaging", "dicom", "nifti", "radiology", "research", "education", "streamlit", "monai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "cryptography>=42.0",
    "matplotlib>=3.8",
    "monai>=1.3,<1.7",
    "nibabel>=5.2",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1.0",
    "openpyxl>=3.1",
    "pandas>=2.0,<4",
    "pillow>=10.0",
    "plotly>=5.18",
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.0",
    "pylibjpeg-rle>=2.0",
    "requests>=2.31",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "simpleitk>=2.2",
    "streamlit>=1.57",
    "streamlit-image-coordinates>=0.3",
    "torch>=2.5,<2.15",
    "torchvision>=0.20,<0.30",
    "transformers>=4.41",
    "zarr>=3.1.6",
]

[project.optional-dependencies]
finetune = [
    "scikit-learn>=1.3",
]
export = []
segmentation = [
    "TotalSegmentator>=2.0",
]
ibsi = [
    "pyradiomics==3.0.1",
    "z-rad==26.9.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engines*", "ui*", "utils*"]
exclude = ["verification*", "tests*", "docs*", "assets*"]

[tool.pytest.ini_options]
testpaths = ["verification/tests"]
addopts = ["--basetemp=cache_logs/pytest_tmp"]
cache_dir = "cache_logs/pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "cache_logs/ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
